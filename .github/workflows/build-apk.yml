name: Build Android APK (MPC)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Sharing
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/MPC_MooN_PES_Competition.apk

      - name: Upload APK Download Link
        uses: actions/upload-artifact@v4
        with:
          name: MPC_MooN_PES_Competition_APK
          path: output/MPC_MooN_PES_Competition.apk
          if-no-files-found: error
